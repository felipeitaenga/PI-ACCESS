version: "3.9"
services:
  mongo:
    image: mongo:7
    restart: always
    volumes: ["mongo_data:/data/db"]
    networks: [nx]

  mosquitto:
    image: eclipse-mosquitto:2
    restart: always
    command: >
      sh -c "printf 'listener 61613\nallow_anonymous true\nlistener 61614\nallow_anonymous true\n' > /mosquitto/config/mosquitto.conf && mosquitto -c /mosquitto/config/mosquitto.conf"
    ports: ["61613:61613", "61614:61614"]
    networks: [nx]

  backend:
    build: ./backend
    restart: always
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=nxaccess
      - JWT_SECRET=${JWT_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - FRONTEND_URL=https://acesso.suaempresa.com
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=61613
    depends_on: [mongo, mosquitto]
    networks: [nx]

  frontend:
    build: ./frontend
    restart: always
    environment:
      - REACT_APP_BACKEND_URL=https://acesso.suaempresa.com
    depends_on: [backend]
    networks: [nx]

volumes: { mongo_data: {} }
networks: { nx: {} }
