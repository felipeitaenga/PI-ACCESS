name: Build e publicação da imagem

# Dispara de duas formas:
#  1) tag vX.Y.Z (release no GitHub)
#  2) alteração do arquivo VERSION no branch main (ex.: 1.0.1)
# Path filters não se aplicam a pushes de tags.
on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/felipeitaenga/pi-access

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: ver
        name: Definir versão
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="$(tr -d ' \n\r' < VERSION)"
          fi
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Versão inválida: '$V'"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Versão: $V"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
